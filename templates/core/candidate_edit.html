{% extends 'base.html' %}

{% block title %}Edit Candidate - {{ candidate.full_name }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8 animate-in">
            <div class="glass-card p-4">
                <div class="d-flex align-items-center mb-4">
                    <a href="{% url 'candidate_detail' candidate.id %}" class="btn btn-light rounded-circle me-3">
                        <i class="fas fa-arrow-left"></i>
                    </a>
                    <div>
                        <h3 class="fw-bold gradient-text mb-0">Edit Candidate</h3>
                        <p class="text-muted mb-0">Update name and email for {{ candidate.full_name }}</p>
                    </div>
                </div>

                <form method="post" class="needs-validation" novalidate>
                    {% csrf_token %}
                    
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">First Name *</label>
                            {{ form.first_name }}
                        </div>
                        
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Last Name *</label>
                            {{ form.last_name }}
                        </div>
                        
                        <div class="col-12">
                            <label class="form-label fw-semibold">Email *</label>
                            {{ form.email }}
                        </div>
                    </div>
                    
                    <div class="d-flex gap-3 mt-4">
                        <button type="submit" class="btn btn-gradient">
                            <i class="fas fa-save me-2"></i>Save Changes
                        </button>
                        <a href="{% url 'candidate_detail' candidate.id %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
