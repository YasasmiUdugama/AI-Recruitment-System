{% extends 'base.html' %}

{% block title %}Create Job - AI Recruitment System{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8 animate-in">
            <div class="glass-card p-4">
                <div class="d-flex align-items-center mb-4">
                    <a href="{% url 'job_list' %}" class="btn btn-light rounded-circle me-3">
                        <i class="fas fa-arrow-left"></i>
                    </a>
                    <div>
                        <h3 class="fw-bold gradient-text mb-0">Create New Job</h3>
                        <p class="text-muted mb-0">Fill in the details for the new position</p>
                    </div>
                </div>

                <form method="post" class="needs-validation" novalidate>
                    {% csrf_token %}
                    
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label fw-semibold">Job Title *</label>
                            <input type="text" name="title" class="form-control" placeholder="e.g., Senior Data Analyst" required>
                        </div>
                        
                        <div class="col-12">
                            <label class="form-label fw-semibold">Job Description *</label>
                            <textarea name="description" class="form-control" rows="5" placeholder="Describe the role, responsibilities, and expectations..." required></textarea>
                        </div>
                        
                        <div class="col-12">
                            <label class="form-label fw-semibold">Required Skills *</label>
                            <textarea name="required_skills" class="form-control" rows="3" placeholder="e.g., Python, SQL, Machine Learning, Data Visualization (comma-separated)"></textarea>
                            <div class="form-text">List skills separated by commas for better matching</div>
                        </div>
                        
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Experience Required</label>
                            <input type="text" name="experience_required" class="form-control" placeholder="e.g., 3-5 years">
                        </div>
                        
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Education Required</label>
                            <input type="text" name="education_required" class="form-control" placeholder="e.g., Bachelor's in Computer Science">
                        </div>
                        
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Department</label>
                            <input type="text" name="department" class="form-control" placeholder="e.g., Engineering">
                        </div>
                        
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Location</label>
                            <input type="text" name="location" class="form-control" placeholder="e.g., Remote / New York">
                        </div>
                    </div>
                    
                    <div class="d-flex gap-3 mt-4">
                        <button type="submit" class="btn btn-gradient">
                            <i class="fas fa-save me-2"></i>Create Job
                        </button>
                        <a href="{% url 'job_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
